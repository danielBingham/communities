<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta http-equiv="X-UA-Compatible" content="ie=edge" />

    <!-- descriptive meta tags -->
    <meta name="application-name" content="Communities" />
    <meta name="keywords" content="social media, non-profit, cooperative, social media platform, multi-stakeholder cooperative, democratic platform, cooperative platform, cooperative social media, non-profit social media" />

    <!--
        Page metadata: the title, description and social sharing (Open Graph)
        tags.

        The server replaces everything between the page-metadata markers with
        the metadata for the page that was requested, so that link previews
        show that page, and the API responses the page would request when the
        server already has them (a script of type application/json, which the
        client's makeRequest reads).  See
        web-application/server/controllers/PageController.js,
        packages/backend/services/PageMetadataService.js and
        web-application/client/state/lib/preloadedResponses.js.

        What's here is only used when this file is served as it is: by the
        mobile apps, which load it from their bundle.  Keep it in step with
        buildDefaultMetadata() in packages/shared/lib/pageMetadata.js.

        The markers start with an exclamation point so that the production
        build's minifier keeps them.  Don't change them without changing
        PageController.
    -->
    <!--! page-metadata:start -->
    <title>Communities -- Cooperative Social Media</title>
    <meta name="description" content="A social media platform that will be a non-profit, cooperative. Funded by users. Governed by those who build it and use it, together." />
    <meta property="og:site_name" content="Communities" />
    <meta property="og:type" content="website" />
    <meta property="og:title" content="Communities -- Cooperative Social Media" />
    <meta property="og:description" content="A social media platform that will be a non-profit, cooperative. Funded by users. Governed by those who build it and use it, together." />
    <meta property="og:image" content="<%- htmlWebpackPlugin.options.meta['communities-host'] %>/social-sharing-image.jpg" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="A phone showing a Communities feed." />
    <meta name="twitter:card" content="summary_large_image" />
    <!--! page-metadata:end -->

    <!-- Google font -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Nunito:ital,wght@0,200..1000;1,200..1000&family=Roboto:ital,wght@0,100;0,300;0,400;0,500;0,700;0,900;1,100;1,300;1,400;1,500;1,700;1,900&display=swap" rel="stylesheet">


    <link rel="icon"  href="<%- require('../../client/assets/communities-marque.svg') %>" sizes="any" />
</head>

<body>
    <div id="root"></div>
</body>

</html>
