name: Release

on:
  workflow_dispatch:
    inputs:
      version:
        decription: 'A semantic version to use when tagging this release.'
        required: true
      environment:
        type: choice
        description: 'The environment to build this container for.  If you choose staging, the version should have an `-rc.N` term.'
        required: true
        options:
          - production
          - staging
jobs:
  build:

    runs-on: ubuntu-latest

    steps:

      - name: Checkout Repo
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc

      - name: Configure AWS CLI
        uses: aws-actions/configure-aws-credentials@v6
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_KEY }}
          aws-region: us-east-1

      # Install, check and test the whole workspace. Dependencies come from the
      # public npm registry, pinned by package-lock.json integrity hashes; the
      # internal @communities/* packages are linked from source.
      - name: Install Dependencies
        run: npm ci

      - name: Check the Lockfile
        run: npm run check:lockfile

      - name: Run Unit Tests
        run: npm test

      # Version the root package and every workspace package (shared,
      # backend, session, worker, web-application) at once. This also updates
      # their entries in package-lock.json. The internal packages aren't
      # published anywhere: the images below build them from source.
      #
      # --include-workspace-root matters: `npx` (which compose.yaml uses to
      # start the dev server) sets npm_package_version from the root
      # package.json, and the client reloads when the server's version doesn't
      # match its own. Without it, only the workspace packages are bumped.
      - name: Version the Root and Workspace Packages
        run: |
          npm version ${{ github.event.inputs.version }} --workspaces --include-workspace-root --no-git-tag-version

      # Build the worker docker container and push it to ECR. Both images build
      # from the repository root so they can install the workspace.
      - name: Build the Worker Docker Container
        run: |
          docker build -f worker/Dockerfile -t 843012963492.dkr.ecr.us-east-1.amazonaws.com/communities/worker:${{ github.event.inputs.version }} .

      - name: Login to ECR
        run: |
          aws ecr get-login-password --region us-east-1 | docker login --username AWS --password-stdin 843012963492.dkr.ecr.us-east-1.amazonaws.com

      - name: Push the newly built container to the Repostory under the ${{ github.event.inputs.version }} tag
        run: |
          docker push 843012963492.dkr.ecr.us-east-1.amazonaws.com/communities/worker:${{ github.event.inputs.version }}

      # Build the web application docker container and push it to ECR.
      - name: Build the  Web Application Docker Container
        run: |
          docker build -f web-application/Dockerfile --build-arg NODE_ENV=${{ github.event.inputs.environment }} -t 843012963492.dkr.ecr.us-east-1.amazonaws.com/communities/web-application:${{ github.event.inputs.version }} .

      - name: Login to ECR
        run: |
          aws ecr get-login-password --region us-east-1 | docker login --username AWS --password-stdin 843012963492.dkr.ecr.us-east-1.amazonaws.com

      - name: Push the newly built container to the Repostory under the ${{ github.event.inputs.version }} tag
        run: |
          docker push 843012963492.dkr.ecr.us-east-1.amazonaws.com/communities/web-application:${{ github.event.inputs.version }}

      # Commit the changes to the package.json package-lock.json files that
      # were made during versioning.
      - name: Commit the version changes
        run: |
          NAME=$( git log --format="%an" ${{ github.sha }}^! )
          EMAIL=$( git log --format="%ae" ${{ github.sha }}^! )
          git config --global user.name $NAME
          git config --global user.email $EMAIL
          git commit -am 'Version ${{ github.event.inputs.version }}'
          git push origin
      - name: Tag the version
        run: |
          NAME=$( git log --format="%an" ${{ github.sha }}^! )
          EMAIL=$( git log --format="%ae" ${{ github.sha }}^! )
          git config --global user.name $NAME
          git config --global user.email $EMAIL
          git tag ${{ github.event.inputs.version }}
          git push origin --tags
