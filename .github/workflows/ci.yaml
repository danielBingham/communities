name: CI

on:
  push:
    branches:
      - main
      - staging
  pull_request:
    branches:
      - main
      - staging

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:

      - name: Checkout Repo
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: npm

      # One install for the whole workspace, from the public npm registry. The
      # internal @communities/* packages are linked from source, so the tests
      # always run against the code in this commit.
      - name: Install Dependencies
        run: npm ci

      - name: Check the Lockfile
        run: npm run check:lockfile

      # Runs the @communities/shared, @communities/backend and web-application
      # unit tests (see the root package.json).
      - name: Run Unit Tests
        run: npm test
